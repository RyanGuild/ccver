name: Build and Push Docker Image with SBOM

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      attestations: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Download Linux binaries
      uses: actions/download-artifact@v4
      with:
        pattern: ccver-linux-*
        path: binaries-temp/
        merge-multiple: true

    - name: Prepare binaries for Docker build
      run: |
        mkdir -p binaries
        # Copy binaries to the Docker build context
        cp binaries-temp/ccver-linux-amd64 binaries/
        cp binaries-temp/ccver-linux-arm64 binaries/
        # List for verification
        ls -lh binaries/

    - name: Download SBOM artifacts
      uses: actions/download-artifact@v4
      with:
        name: sbom-${{ github.sha }}
        path: sbom/

    - name: List SBOM files
      run: |
        echo "SBOM files for Docker image:"
        ls -lh sbom/

    - name: Install Syft (for Docker SBOM generation)
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
        labels: |
          org.opencontainers.image.title=ccver
          org.opencontainers.image.description=A zero dependency tool for Conventional Commits with embedded SBOM
          org.opencontainers.image.vendor=ccver

    - name: Build and push Docker image
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        sbom: true
        provenance: mode=max

    - name: Generate Docker SBOM (amd64)
      if: github.event_name != 'pull_request'
      run: |
        docker pull --platform linux/amd64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)
        syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7) --platform linux/amd64 -o cyclonedx-json=sbom/sbom-docker-amd64-cyclonedx.json
        syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7) --platform linux/amd64 -o spdx-json=sbom/sbom-docker-amd64-spdx.json

    - name: Generate Docker SBOM (arm64)
      if: github.event_name != 'pull_request'
      run: |
        docker pull --platform linux/arm64 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)
        syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7) --platform linux/arm64 -o cyclonedx-json=sbom/sbom-docker-arm64-cyclonedx.json
        syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7) --platform linux/arm64 -o spdx-json=sbom/sbom-docker-arm64-spdx.json

    - name: Upload Docker SBOM artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: sbom-docker-${{ github.sha }}
        path: sbom/sbom-docker-*
        retention-days: 90

    - name: Create attestation for SBOM
      if: github.event_name != 'pull_request'
      uses: actions/attest-sbom@v1
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.docker_build.outputs.digest }}
        sbom-path: sbom/sbom-docker-amd64-cyclonedx.json
        push-to-registry: true

    - name: Generate summary
      run: |
        cat > $GITHUB_STEP_SUMMARY << 'EOF'
        ## 📋 Docker Image Build Results

        Multi-platform Docker images have been built with embedded SBOMs.

        ### Embedded SBOMs (from SBOM workflow)
        - **Cargo Dependencies (CycloneDX)**: Complete dependency tree from Cargo.lock
        - **Cargo Dependencies (SPDX)**: SPDX format for tooling compatibility
        - **Binary Analysis (CycloneDX)**: Deep binary analysis including system libraries
        - **Binary Analysis (SPDX)**: SPDX format binary analysis

        ### Docker-specific SBOMs
        - **Docker Image (amd64)**: Platform-specific SBOM for amd64
        - **Docker Image (arm64)**: Platform-specific SBOM for arm64

        ### Artifacts
        All Docker-specific SBOM files are available in the workflow artifacts.

        EOF

    - name: Add Docker summary
      if: github.event_name != 'pull_request'
      run: |
        cat >> $GITHUB_STEP_SUMMARY << 'EOF'

        ### 🐳 Multi-Platform Docker Image with SBOM

        The Docker image has been built for multiple platforms:
        - ✅ linux/amd64 (x86_64)
        - ✅ linux/arm64 (aarch64)

        Each platform includes:
        - ✅ Embedded SBOM metadata
        - ✅ Provenance attestation
        - ✅ SBOM attestation signed and pushed to registry
        - ✅ Platform-specific SBOM generated (CycloneDX and SPDX formats)

        ### Security Features
        - SBOM is cryptographically signed and stored in the registry
        - Provenance tracking enabled for full build transparency
        - Compatible with supply chain security tools (Sigstore, cosign, etc.)
        - Uses pre-built, attested binaries from the build workflow (no compilation in Docker)

        ### Verification
        You can verify the SBOM attestation using:
        ```bash
        gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7) --owner ${{ github.repository_owner }}
        ```

        EOF

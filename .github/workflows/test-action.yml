name: Test CCVer Action

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  ACT_RUNNER: false
  REGISTRY: ghcr.io
  IMAGE_NAME: ryanguild/ccver

jobs:
  test-basic:
    runs-on: ubuntu-latest
    name: Test Basic Version Output
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Linux binaries from build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ccver-linux-*
          path: binaries-temp/
          merge-multiple: true
        if: env.ACT_RUNNER != 'true'

      - name: Build binaries for act (if needed)
        if: env.ACT_RUNNER == 'true'
        run: |
          # Check if binaries already exist
          if [ -f "binaries-temp/ccver-linux-amd64" ] || [ -f "binaries-temp/ccver-linux-arm64" ]; then
            echo "Binaries already exist, skipping build"
            exit 0
          fi

          echo "Building binaries locally for act..."

          # Install Rust if not available
          if ! command -v rustc &> /dev/null; then
            echo "Installing Rust..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source $HOME/.cargo/env || true
          fi

          # Ensure cargo is in PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi

          # Detect architecture
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)
              TARGET="x86_64-unknown-linux-gnu"
              BINARY_NAME="ccver-linux-amd64"
              ;;
            aarch64|arm64)
              TARGET="aarch64-unknown-linux-gnu"
              BINARY_NAME="ccver-linux-arm64"
              ;;
            *)
              echo "::error::Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          echo "Building for target: $TARGET"

          # Add target if needed
          rustup target add $TARGET 2>/dev/null || true

          # Build the binary
          cargo build --release --target $TARGET

          # Copy to binaries-temp
          mkdir -p binaries-temp
          cp target/$TARGET/release/ccver binaries-temp/$BINARY_NAME
          chmod +x binaries-temp/$BINARY_NAME

          echo "Built binary: binaries-temp/$BINARY_NAME"
          ls -lh binaries-temp/$BINARY_NAME

      - name: Prepare binaries for Docker build
        run: |
          mkdir -p binaries

          # Copy binaries from artifacts to Docker build context
          if [ -d "binaries-temp" ] && [ "$(ls -A binaries-temp 2>/dev/null)" ]; then
            echo "Copying binaries from artifacts"
            cp binaries-temp/ccver-linux-amd64 binaries/ 2>/dev/null || true
            cp binaries-temp/ccver-linux-arm64 binaries/ 2>/dev/null || true
            ls -lh binaries/ || echo "Warning: No binaries copied"
          fi

          # Verify binaries exist
          if [ ! -f "binaries/ccver-linux-amd64" ] && [ ! -f "binaries/ccver-linux-arm64" ]; then
            if [ "${{ env.ACT_RUNNER }}" = "true" ]; then
              echo "::error::Binaries not found and could not be built!"
              echo "For local testing with act:"
              echo "1. Ensure Rust is installed: rustup install stable"
              echo "2. Or run the build workflow first: cargo run --bin act-runner run build"
              echo "3. Or manually build: cargo build --release --target \$(uname -m)-unknown-linux-gnu"
              exit 1
            else
              echo "::error::Binaries not found!"
              echo "In GitHub Actions: This workflow requires the build workflow to run first."
              echo "The build workflow must upload artifacts (ccver-linux-amd64, ccver-linux-arm64) before test-action can run."
              exit 1
            fi
          fi

          # Create placeholder SBOM directory
          mkdir -p sbom
          touch sbom/.gitkeep

      - name: Clear Docker cache for act
        if: env.ACT_RUNNER == 'true'
        run: |
          # Remove any existing Docker images that might cause platform conflicts
          docker image rm act-dockeraction:latest 2>/dev/null || true
          docker builder prune -f || true

      - name: Run CCVer Action
        id: ccver
        uses: ./
        with:
          path: '.'
          ci: 'false'

      - name: Print Version
        run: |
          echo "Version: ${{ steps.ccver.outputs.version }}"

  test-changelog:
    runs-on: ubuntu-latest
    name: Test Changelog Generation
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Linux binaries from build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ccver-linux-*
          path: binaries-temp/
          merge-multiple: true
        if: env.ACT_RUNNER != 'true'

      - name: Build binaries for act (if needed)
        if: env.ACT_RUNNER == 'true'
        run: |
          # Check if binaries already exist
          if [ -f "binaries-temp/ccver-linux-amd64" ] || [ -f "binaries-temp/ccver-linux-arm64" ]; then
            echo "Binaries already exist, skipping build"
            exit 0
          fi

          echo "Building binaries locally for act..."

          # Install Rust if not available
          if ! command -v rustc &> /dev/null; then
            echo "Installing Rust..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source $HOME/.cargo/env || true
          fi

          # Ensure cargo is in PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi

          # Detect architecture
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)
              TARGET="x86_64-unknown-linux-gnu"
              BINARY_NAME="ccver-linux-amd64"
              ;;
            aarch64|arm64)
              TARGET="aarch64-unknown-linux-gnu"
              BINARY_NAME="ccver-linux-arm64"
              ;;
            *)
              echo "::error::Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          echo "Building for target: $TARGET"

          # Add target if needed
          rustup target add $TARGET 2>/dev/null || true

          # Build the binary
          cargo build --release --target $TARGET

          # Copy to binaries-temp
          mkdir -p binaries-temp
          cp target/$TARGET/release/ccver binaries-temp/$BINARY_NAME
          chmod +x binaries-temp/$BINARY_NAME

          echo "Built binary: binaries-temp/$BINARY_NAME"
          ls -lh binaries-temp/$BINARY_NAME

      - name: Prepare binaries for Docker build
        run: |
          mkdir -p binaries

          # Copy binaries from artifacts to Docker build context
          if [ -d "binaries-temp" ] && [ "$(ls -A binaries-temp 2>/dev/null)" ]; then
            echo "Copying binaries from artifacts"
            cp binaries-temp/ccver-linux-amd64 binaries/ 2>/dev/null || true
            cp binaries-temp/ccver-linux-arm64 binaries/ 2>/dev/null || true

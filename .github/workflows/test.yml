name: Create Test Report

on:
  workflow_call: {}

permissions:
  checks: write

jobs:
  test:
    name: ❓ Create Test Report
    runs-on: ${{ matrix.target.runner }}
    strategy:
      matrix:
        rust: [stable]
        target:
          - runner: ubuntu-latest
            arch: x86_64-unknown-linux-gnu
          - runner: windows-latest
            arch: x86_64-pc-windows-msvc
          - runner: macos-latest
            arch: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
      - name: Get Rust Cache
        uses: ./.github/actions/rust_depcache
        with:
          runner: ${{ matrix.target.runner }}
          arch: ${{ matrix.target.arch }}
          rust: ${{ matrix.rust }}
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: Run Tests
        run: cargo nextest run --profile ci --status-level all --junit tests/results.xml
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: ${{matrix.target.runner}} Tests          # Name of the check run which will be created
          path: tests/*.xml    # Path to test results
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: true

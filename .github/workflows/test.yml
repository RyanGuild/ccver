name: Create Test Report

on:
  workflow_call: {}

permissions:
  checks: write

jobs:
  test:
    name: ❓ Create Test Report
    runs-on: ${{ matrix.target.runner }}
    strategy:
      matrix:
        rust: [stable]
        target:
          - runner: ubuntu-latest
            arch: x86_64-unknown-linux-gnu
          - runner: windows-latest
            arch: x86_64-pc-windows-msvc
          - runner: macos-latest
            arch: aarch64-apple-darwin
    steps:
      - name: Skip unsupported act targets
        if: env.ACT_RUNNER == 'true' && matrix.target.runner != 'ubuntu-latest'
        run: |
          echo "⏭️  Skipping ${{ matrix.target.runner }} - only ubuntu-latest works in act"
          echo "   This target will test successfully on GitHub Actions"
          exit 0

      - name: Checkout
        if: env.ACT_RUNNER != 'true' || matrix.target.runner == 'ubuntu-latest'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
      - name: Install Rust toolchain
        if: env.ACT_RUNNER != 'true' || matrix.target.runner == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target.arch }}
      - name: Cache cargo dependencies
        if: env.ACT_RUNNER != 'true' || matrix.target.runner == 'ubuntu-latest'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.arch }}
      - name: Install cargo-nextest
        if: env.ACT_RUNNER != 'true' || matrix.target.runner == 'ubuntu-latest'
        run: cargo install cargo-nextest --locked
      - name: Run Tests
        if: env.ACT_RUNNER != 'true' || matrix.target.runner == 'ubuntu-latest'
        run: cargo nextest run --profile ci --status-level all

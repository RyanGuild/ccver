name: Profile

on:
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      size:
        description: 'Number of commits to profile'
        required: false
        default: '5000'
        type: string
  workflow_call:
    inputs:
      size:
        description: 'Number of commits to profile'
        required: false
        default: '5000'
        type: string

jobs:
  profile:
    name: Generate Flamegraphs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: profile-${{ runner.os }}

      - name: Install profiling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic

      - name: Enable perf events
        run: |
          # Allow perf events for non-root users in GitHub Actions
          echo -1 | sudo tee /proc/sys/kernel/perf_event_paranoid
          echo 0 | sudo tee /proc/sys/kernel/kptr_restrict

      - name: Build profiling binary
        run: cargo build --profile profiling --features profiling --bin profile

      - name: Run profiling utility
        env:
          SIZE: ${{ github.event.inputs.size || '5000' }}
        run: |
          mkdir -p target/profiling
          cargo run --profile profiling --features profiling --bin profile -- all $SIZE

      - name: Upload flamegraphs
        uses: actions/upload-artifact@v4
        with:
          name: flamegraphs-${{ github.sha }}
          path: target/profiling/*.svg
          retention-days: 30

      - name: Generate profiling summary
        run: |
          cat > $GITHUB_STEP_SUMMARY << 'EOF'
          ## Profiling Results

          Flamegraphs and benchmark reports have been generated and uploaded as artifacts.

          ### Profiled Operations
          - ✓ Parse operations
          - ✓ Graph construction
          - ✓ End-to-end workflow
          - ✓ Command operations

          ### Artifacts
          - **flamegraphs**: Flamegraphs from profiling utility
          - **criterion-reports**: Detailed benchmark HTML reports

          ### View Flamegraphs
          Open the SVG files in your browser to interactively explore the call stacks.

          EOF

  compare-baseline:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    if: ${{ github.head_ref != null }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks (base)
        run: |
          cargo bench --bench e2e_bench --bench parse_bench --bench graph_bench --bench command_bench -- --save-baseline base

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Run benchmarks (PR) and compare
        id: benchmark
        run: |
          cargo bench --bench e2e_bench --bench parse_bench --bench graph_bench --bench command_bench -- --baseline base > benchmark_output.txt 2>&1 || true
          cat benchmark_output.txt

      - name: Check for regressions
        id: check_regression
        run: |
          # Parse benchmark output for regressions
          # Look for lines indicating performance degradation (time increased by >5%)
          if grep -E "(change:.*\+[5-9]\.[0-9]+%|change:.*\+[1-9][0-9]\.[0-9]+%)" benchmark_output.txt; then
            echo "has_regression=true" >> $GITHUB_OUTPUT
            echo "⚠️ **Performance Regression Detected!**" > regression_summary.txt
            echo "" >> regression_summary.txt
            echo "The following benchmarks show performance regressions (>5% slower):" >> regression_summary.txt
            echo '```' >> regression_summary.txt
            grep -B2 -E "(change:.*\+[5-9]\.[0-9]+%|change:.*\+[1-9][0-9]\.[0-9]+%)" benchmark_output.txt >> regression_summary.txt || true
            echo '```' >> regression_summary.txt
          else
            echo "has_regression=false" >> $GITHUB_OUTPUT
            echo "✅ **No Significant Performance Regressions**" > regression_summary.txt
            echo "" >> regression_summary.txt
            echo "All benchmarks are within acceptable performance range (<5% regression)." >> regression_summary.txt
          fi

          # Extract key benchmark results
          echo "" >> regression_summary.txt
          echo "### Key Benchmark Results" >> regression_summary.txt
          echo '```' >> regression_summary.txt
          grep -E "(test result:|Benchmarking|time:.*change:)" benchmark_output.txt | head -20 >> regression_summary.txt || true
          echo '```' >> regression_summary.txt

      - name: Create PR comment body
        run: |
          cat > pr_comment.txt << 'EOF'
          ## 📊 Benchmark Results

          EOF
          cat regression_summary.txt >> pr_comment.txt
          echo "" >> pr_comment.txt
          echo "---" >> pr_comment.txt
          echo "_Download the \`benchmark-comparison-${{ github.sha }}\` artifact for detailed Criterion HTML reports._" >> pr_comment.txt

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr_comment.txt', 'utf8');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 Benchmark Results')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Upload benchmark comparison
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison-${{ github.sha }}
          path: |
            benchmark_output.txt
            target/criterion/
          retention-days: 30

      - name: Post comparison results to summary
        run: |
          cat > $GITHUB_STEP_SUMMARY << 'EOF'
          ## Benchmark Comparison

          EOF
          cat regression_summary.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Full Results" >> $GITHUB_STEP_SUMMARY
          echo "Download the benchmark-comparison artifact for detailed Criterion reports." >> $GITHUB_STEP_SUMMARY

      - name: Create warning annotation on regression
        if: steps.check_regression.outputs.has_regression == 'true'
        run: |
          echo "::warning::Performance regression detected! Some benchmarks are >5% slower than the base branch. Review the benchmark comparison artifact for details."

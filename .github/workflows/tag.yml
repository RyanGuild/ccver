name: Update Version and Tag

on:
  workflow_call: {}

permissions:
  contents: write

jobs:
  update-version:
    name: 📝 Update Version in Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust toolchain and cargo dependencies
        uses: actions/cache@v4
        id: cargo_cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.rustup/
            target/
          key: ${{ runner.os }}-rust-stable-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-stable-x86_64-unknown-linux-gnu-
            ${{ runner.os }}-rust-stable-
            ${{ runner.os }}-rust-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Run version updater
        id: update-cargo-toml-version
        run: cargo run --bin update-cargo-toml-version --release

      - name: Check for changes
        id: check-for-changes
        run: |
          if git diff --quiet Cargo.toml; then
            echo "No changes to Cargo.toml"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes to Cargo.toml"
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit change
        if: steps.check-for-changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: update version in Cargo.toml"
          git push

      - name: Fail workflow if changes were made
        if: steps.check-for-changes.outputs.changes == 'true'
        run: |
          echo "::error::Version was updated in Cargo.toml. Please re-run the workflow with the updated version."
          exit 1

[toolchain]
channel = "nightly"
components = ["rustfmt", "clippy"]
targets = [
    # Linux targets
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",    # For Alpine/static builds
    "aarch64-unknown-linux-musl",   # For Alpine ARM

    # macOS targets
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",

    # Windows targets
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",      # Windows ARM64
]
profile = "minimal"

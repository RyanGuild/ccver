[package]
name = "ccver"
version = "2.26.0-featuremonitoring.0"
edition = "2024"
authors = [ "Ryan Guild <rdg27@pitt.edu>" ]
license-file = "LICENSE"
description = "a zero dependency tool for Conventional Commits"
documentation = "https://ryanguild.github.io/ccver/ccver/index.html"
default-run = "ccver"

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = true

[[bin]]
name = "update-cargo-toml-version"
path = "bin/update-cargo-toml-version.rs"

[[bin]]
name = "check-cargo-toml-version"
path = "bin/check-cargo-toml-version.rs"

[[bin]]
name = "analyze-benchmarks"
path = "bin/analyze-benchmarks.rs"

[[bin]]
name = "profile"
path = "bin/profile.rs"
required-features = ["profiling"]

[dev-dependencies]
indoc = "2"
serial_test="3.2.0"
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "parse_bench"
harness = false

[[bench]]
name = "graph_bench"
harness = false

[[bench]]
name = "command_bench"
harness = false

[[bench]]
name = "e2e_bench"
harness = false

[dependencies]
toml_edit = "0.23.7"
pest_consume = "1.1.3"
eyre = "0.6.12"
tracing = "0.1.41"
tracing-error = "0.2.0"
chrono = "0.4.40"
rustc-hash = "2.0"

  [dependencies.pest_derive]
  version = "2.7.15"
  default-features = false

  [dependencies.pest]
  version = "2.7.15"
  default-features = false

  [dependencies.clap]
  version = "4.5.49"
  features = [ "derive", "env" ]

  [dependencies.petgraph]
  version = "0.8.2"
  features = [ "graphmap" ]
  default-features = false

  [dependencies.tracing-subscriber]
  version = "0.3.20"
  features = [ "env-filter" ]

  [dependencies.pprof]
  version = "0.15"
  features = ["flamegraph"]
  optional = true

[features]
profiling = ["pprof"]
